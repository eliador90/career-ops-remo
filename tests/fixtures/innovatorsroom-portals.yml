# tests/fixtures/innovatorsroom-portals.yml — minimal title/location filter
# config for tests/innovatorsroom-html-parse.test.mjs and
# tests/innovatorsroom-cli.test.mjs. Deliberately narrow: only "chief
# operating officer" is a positive title keyword, so exactly one role in
# tests/fixtures/innovatorsroom-jobdrop.html (Evotym) matches — every other
# fixture role uses a different C-level/VP/manager title on purpose, so the
# filter pass count stays a hard 1 rather than an incidental one.
title_filter:
  positive:
    - "chief operating officer"
location_filter:
  always_allow:
    - "remote"
